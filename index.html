<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,onSnapshot,getDocs,runTransaction,writeBatch,serverTimestamp,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// 1) Pegá acá la configuración de tu proyecto Firebase (Configuración del proyecto > Tus apps > Web)
const firebaseConfig={apiKey:"AIzaSyCGmPIAcuY-WwNxPEBHelTYOE3TEoVg4fI",authDomain:"homepro-9b0d8.firebaseapp.com",projectId:"homepro-9b0d8",storageBucket:"homepro-9b0d8.firebasestorage.app",messagingSenderId:"411718341624",appId:"1:411718341624:web:3f350041ed43c69253fc0d"};

const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const fmt=s=>new Date(s).toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
const st=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const EST=['confirmada','en_camino','en_ejecucion','finalizada','cerrada'];
const LBL={confirmada:'Confirmada',en_camino:'Prestador en camino',en_ejecucion:'En ejecución',finalizada:'Trabajo finalizado',cerrada:'Cerrada',cancelada:'Cancelada'};
const RUB=['Plomería','Electricidad','Gas','Albañilería','Mantenimiento'];
const NAV={cliente:[['home','home','Inicio'],['cat','grid','Categorías'],['ords','calendar','Agenda'],['perfil','user','Perfil']],prestador:[['pag','calendar','Agenda'],['pturn','clock','Turnos'],['perfil','user','Perfil']],admin:[['adm','check','Prestadores'],['perfil','user','Perfil']]};
const HOME={cliente:'home',prestador:'pag',admin:'adm'};
const LG='<span class="logo"><svg width="36" height="32" viewBox="0 0 34 30" aria-hidden="true"><path d="M17 2 2 14h4v13h22V14h4z" fill="#1E5BD8"/><rect x="11" y="16" width="12" height="11" rx="2" fill="#3DB36B"/></svg><span>HomePro<i>360</i></span></span>';
const S={view:'load',tab:'login',rol:'cliente',orders:[],pres:[],revs:[],rat:{},pend:[],slots:[],myslots:[],me:null,mp:null};
const errMsg=e=>({'auth/email-already-in-use':'Ese email ya está registrado','auth/invalid-credential':'Email o contraseña incorrectos','auth/invalid-email':'El email no es válido','auth/weak-password':'La contraseña debe tener al menos 6 caracteres','permission-denied':'No tenés permiso para esa acción'}[e.code]||e.message);
const avg=id=>{const a=S.rat[id];return a?a.reduce((x,y)=>x+y,0)/a.length:0};
const ord=()=>S.orders.find(o=>o.id===S.oid);
let unsub=[],unslots=null,app,auth,db;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function go(v,x){Object.assign(S,x||{});S.view=v;render()}

const ocard=o=>`<button class="card" data-a="ord" data-id="${o.id}"><div class="row"><b>${esc(o.rubro)} · ${esc(S.me.role==='cliente'?o.prestadorNombre:o.clienteNombre)}</b><span class="pill ${o.estado==='cerrada'?'rel':'hold'}">${LBL[o.estado]}</span></div><div class="sub">${fmt(o.inicio)} · ${esc(o.direccion)}</div></button>`;
const fld=(k,ph,t)=>`<label class="fld"><input ${t?'type="'+t+'"':''} data-m="${k}" placeholder="${ph}" aria-label="${ph}" value="${esc(S[k])}"></label>`;

const V={
load:()=>'<p class="sub">Cargando…</p>',
setup:()=>'<h1>Falta configurar Firebase</h1><p class="sub">Abrí index.html y reemplazá los valores de firebaseConfig por los de tu proyecto HomePro. Los pasos están en el README.</p>',
auth:()=>{const r=S.tab==='reg',p=S.rol==='prestador';
 return `<h1>${r?'Crear cuenta':'Ingresar'}</h1><div class="chips"><button class="chip ${!r?'on':''}" data-a="tab" data-v="login">Ingresar</button><button class="chip ${r?'on':''}" data-a="tab" data-v="reg">Registrarme</button></div>`+
 (r?fld('nom','Nombre y apellido'):'')+fld('em','Email','email')+`<label class="fld"><input type="password" data-m="pw" placeholder="Contraseña (mínimo 6)" aria-label="Contraseña" value="${esc(S.pw)}"></label>`+
 (r?`<div class="chips"><button class="chip ${!p?'on':''}" data-a="rol" data-v="cliente">Soy cliente</button><button class="chip ${p?'on':''}" data-a="rol" data-v="prestador">Soy prestador</button></div>`+
  (p?`<label class="fld"><select data-m="rub" aria-label="Rubro">${RUB.map(x=>`<option ${x===(S.rub||RUB[0])?'selected':''}>${x}</option>`).join('')}</select></label>`+fld('zona','Zona de trabajo (ej. Palermo, CABA)')+fld('desde','Precio de visita desde ($)','number')+`<label class="fld"><textarea rows="2" data-m="desc" placeholder="Describí tu servicio" aria-label="Descripción">${esc(S.desc)}</textarea></label><p class="sub">Revisamos tu perfil antes de mostrarlo en el listado.</p>`:''):'')+
 `<button class="btn" data-a="${r?'reg':'login'}">${r?'Crear cuenta':'Ingresar'}</button>`+(r?'':'<button class="btn alt" data-a="reset">Olvidé mi contraseña</button>');
},
svc:()=>{const l=S.pres.filter(p=>!S.rf||p.rubro===S.rf);
 return `<h1>Servicios del hogar</h1><div class="fl">${RUB.map(r=>`<button class="chip ${S.rf===r?'on':''}" data-a="rf" data-v="${r}">${r}</button>`).join('')}</div>`+
 (l.length?l.map(p=>`<button class="card" data-a="det" data-id="${p.id}"><div class="row"><b>${esc(p.nombre)}</b><span class="sg">${avg(p.id)?st(avg(p.id)):''}</span></div><div class="sub">${esc(p.rubro)} · ${esc(p.zona)}</div><div class="price" style="margin-top:6px">Visita desde ${m(p.desde)}</div><div class="sub">${S.rat[p.id]?S.rat[p.id].length+' opiniones':'Nuevo en HomePro'}</div></button>`).join(''):'<p class="sub">Todavía no hay prestadores aprobados en esta categoría.</p>');
},
det:()=>{const p=S.pres.find(x=>x.id===S.pid);if(!p)return '<p class="sub">Prestador no encontrado.</p>';
 const rv=S.revs.filter(x=>x.prestadorId===p.id);
 return `<button class="back" data-a="go" data-v="svc">‹ Volver</button><h1>${esc(p.nombre)}</h1><p class="sub">${esc(p.rubro)} · ${esc(p.zona)} · Visita desde ${m(p.desde)}</p><p>${esc(p.desc)}</p>`+
 `<h2>Turnos disponibles</h2><div class="chips" id="slots"></div>`+fld('dir','Dirección del trabajo')+`<label class="fld"><textarea rows="2" data-m="nt" placeholder="Notas (opcional)" aria-label="Notas">${esc(S.nt)}</textarea></label>`+
 `<button class="btn" data-a="book">Confirmar reserva</button><p class="sub" style="text-align:center">El pago se coordina directamente con el prestador. Pronto: pago seguro dentro de la app.</p>`+
 `<h2>Opiniones de clientes</h2>`+(rv.length?rv.map(r=>`<div class="rv"><span class="rav">★</span><div><span class="sg">${st(r.estrellas)}</span><div class="sub">${esc(r.texto)||'Sin comentario'}</div></div></div>`).join(''):'<p class="sub">Todavía no tiene opiniones.</p>');
},
ords:()=>{const l=S.orders.slice().sort((a,b)=>a.inicio<b.inicio?1:-1);return '<h1>Agenda y reservas</h1>'+(l.length?l.map(ocard).join(''):'<p class="sub">Todavía no tenés reservas. Elegí un servicio para empezar.</p>')},
ord:()=>{const o=ord();if(!o)return '<p class="sub">Orden no encontrada.</p>';
 const r=S.me.role,i=EST.indexOf(o.estado);

pag:()=>{const p=S.mp||{},l=S.orders.filter(o=>o.estado!=='cancelada').sort((a,b)=>a.inicio<b.inicio?-1:1),a=avg(S.me.id);

function readPhoto(file,w,h){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),k=Math.max(w/im.width,h/im.height),sw=w/k,sh=h/k;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,h);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
function drawSlots(){
 const el=$('#slots');if(!el)return;
 const n=nowL(),l=S.slots.filter(s=>s.estado==='libre'&&s.inicio>n).sort((a,b)=>a.inicio<b.inicio?-1:1);
 if(!l.length){el.innerHTML='<p class="sub">Este prestador no tiene turnos libres por ahora.</p>';return}
 const days=[...new Set(l.map(s=>s.inicio.slice(0,10)))];if(!days.includes(S.fd))S.fd=days[0];
 const hs=l.filter(s=>s.inicio.startsWith(S.fd));if(!hs.some(s=>s.id===S.sid))S.sid=hs[0].id;
 const dl=d=>new Date(d+'T12:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
 el.innerHTML=`<div class="qg"><label class="fld">${ic('calendar',20)}<select id="sdia" aria-label="Fecha">${days.map(d=>`<option value="${d}" ${d===S.fd?'selected':''}>${dl(d)}</option>`).join('')}</select></label><label class="fld">${ic('clock',20)}<select id="shora" aria-label="Hora">${hs.map(s=>`<option value="${s.id}" ${s.id===S.sid?'selected':''}>${s.inicio.slice(11)}</option>`).join('')}</select></label></div>`;
}

IC.bell='<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>';

IC.heart='<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>';
const nic=n=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICS[n]}</svg>`;
function avb(p,solid){
 const n=nowL();
 if(!p.next)return `<span class="${solid?'gr':'av n'}">Sin turnos por ahora</span>`;
 const mins=(new Date(p.next)-new Date(n))/60000,d=p.next.slice(0,10),hoy=n.slice(0,10),man=new Date(Date.now()+864e5-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
 if(d===hoy&&mins<=60)return `<span class="${solid?'ok2':'av g'}">Disponible ahora</span>`;
 if(d===hoy)return `<span class="${solid?'wn':'av o'}">Disponible ${p.next.slice(11)}</span>`;
 if(d===man)return `<span class="${solid?'gr':'av n'}">Disponible mañana</span>`;
 return `<span class="${solid?'gr':'av n'}">Disponible ${p.next.slice(8,10)}/${p.next.slice(5,7)}</span>`;
}
function svcList(){
 const q=(S.q||'').toLowerCase().trim(),n=nowL();
 let l=S.pres.filter(p=>(!S.rf||p.rubro===S.rf)&&(!S.fv||S.favs.includes(p.id))&&(!S.ur||(p.next&&(new Date(p.next)-new Date(n))/60000<=180))&&(!q||(p.nombre+' '+p.rubro+' '+p.zona).toLowerCase().includes(q)));
 l=l.slice().sort((a,b)=>S.pr?a.desde-b.desde:((a.next||'9')<(b.next||'9')?-1:1));
 return l.length?l.map(pcard).join(''):'<p class="sub">No hay prestadores con esos filtros todavía.</p>';
}
function hdr(v,r){
 const back={det:'svc',bk:'det',ord:r==='cliente'?'ords':'pag',favs:'home',hist:'home'}[v];
 if(v==='det'){const f=S.favs.includes(S.pid);return `<button class="ib" data-a="back" data-v="svc" aria-label="Volver">${ic('arrow')}</button>${LG}<span class="hr"><button class="ib" data-a="share" aria-label="Compartir">${ic('share')}</button><button class="ib" data-a="fav" aria-label="Favorito" style="color:#F5B301">${ic('star',24,f)}</button></span>`}
 if(back)return `<button class="ib" data-a="back" data-v="${back}" aria-label="Volver">${ic('arrow')}</button>${LG}<span class="hr"></span>`;
 return LG+`<span class="hr">${r?`<button class="ib" data-a="bell" aria-label="Notificaciones">${v==='home'?nic('bell'):ic('bell')}</button>${v==='home'?`<button class="ava" data-a="go" data-v="perfil" aria-label="Perfil">${esc(((S.me&&S.me.nombre)||'?')[0].toUpperCase())}</button>`:''}`:''}</span>`;
}
function render(){
 const v=S.view,r=S.me?.role,n=r?NAV[r]:[];
 $('header').innerHTML=hdr(v,r);
 $('#main').innerHTML=V[v]();
 if(v==='auth'||v==='perfil')$('#main').insertAdjacentHTML('afterbegin',inst());
 const cur=v==='bk'?'ords':(['svc','det','favs','hist'].includes(v)?'home':(v==='ord'?(r==='cliente'?'ords':'pag'):v));
 const nv=$('#nav');nv.style.display=n.length?'grid':'none';nv.style.gridTemplateColumns=`repeat(${n.length||1},1fr)`;
 nv.innerHTML=n.map(x=>`<button class="${x[0]===cur?'on':''}" data-a="go" data-v="${x[0]}">${nic(x[1])}${x[2]}</button>`).join('');
 if(S.last!==v){window.scrollTo(0,0);S.last=v}
 if(v==='det')drawSlots();

async function loadPub(){
 const a=await getDocs(query(collection(db,'prestadores'),where('estado','==','aprobado')));S.pres=a.docs.map(d=>({id:d.id,...d.data()}));
 await Promise.all(S.pres.map(async p=>{try{const q=await getDocs(collection(db,'prestadores',p.id,'turnos')),n=nowL();p.next=q.docs.map(d=>d.data()).filter(t=>t.estado==='libre'&&t.inicio>n).map(t=>t.inicio).sort()[0]||null}catch(e){p.next=null}}));
 const r=await getDocs(collection(db,'resenas'));S.revs=r.docs.map(d=>d.data());
 S.rat={};S.revs.forEach(x=>{(S.rat[x.prestadorId]??=[]).push(x.estrellas)});
}
async function loadPend(){const q=await getDocs(query(collection(db,'prestadores'),where('estado','==','pendiente')));S.pend=q.docs.map(d=>({id:d.id,...d.data()}))}
function clean(){unsub.forEach(f=>f());unsub=[];if(unslots){unslots();unslots=null}}
async function boot(u){
 clean();
 const sn=await getDoc(doc(db,'users',u.uid));
 if(!sn.exists()){toast('Tu cuenta no tiene perfil. Registrate de nuevo con otro email.');await signOut(auth);return}
 S.me={id:u.uid,...sn.data()};S.orders=[];S.myslots=[];S.mp=null;
 const role=S.me.role;
 if(role==='prestador'){
  unsub.push(onSnapshot(doc(db,'prestadores',u.uid),d=>{S.mp=d.data();if(['pag','pturn','perfil'].includes(S.view))render()}));
  unsub.push(onSnapshot(collection(db,'prestadores',u.uid,'turnos'),q=>{S.myslots=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==='pturn')render()}));
 }
 if(role!=='admin'){
  const f=role==='cliente'?'clienteId':'prestadorId';
  unsub.push(onSnapshot(query(collection(db,'ordenes'),where(f,'==',u.uid)),q=>{S.orders=q.docs.map(d=>({id:d.id,...d.data()}));if(['ords','ord','pag'].includes(S.view))render()}));
 }
 await loadPub();if(role==='admin')await loadPend();
 go(HOME[role]);
}

 (S.pf?`<div class="card" style="margin-top:10px"><b>${esc(p.rubro)}</b><div class="sub">${esc(p.zona)} · Perfil revisado y aprobado por HomePro</div></div>`:'')+
 `<h2>Turnos disponibles</h2><div id="slots"></div><button class="btn" data-a="tobk">Reservar ahora</button><p class="sub c">El pago se coordina directamente con el prestador. Pronto: pago seguro dentro de la app.</p><h2>Opiniones de clientes</h2>`+
 (rv.length?rv.map(r=>`<div class="rv"><span class="rav">${esc((r.texto||'★')[0].toUpperCase())}</span><div><span class="sg">${st(r.estrellas)}</span><div class="sub">${esc(r.texto)||'Sin comentario'}</div></div></div>`).join(''):'<p class="sub">Todavía no tiene opiniones.</p>')};
V.bk=()=>{const p=S.pres.find(x=>x.id===S.pid),s=S.pick||{},done=!!S.conf;
 return `<div class="card pc"><div class="th" style="width:96px">${img(p)}</div><div class="bd2"><b>${esc(p.nombre)}</b><div>${avb(p,1)}</div><div class="price" style="margin-top:4px">Desde ${m(p.desde)}</div></div></div><div class="qg"><div class="fld">${ic('calendar',20)}<span>Fecha</span><b>${s.inicio?fmtD(s.inicio):'–'}</b></div><div class="fld">${ic('clock',20)}<span>Hora</span><b>${s.inicio?s.inicio.slice(11):'–'}</b></div></div>`+
 `<label class="fld">${ic('pin',20)}<input data-m="dir" placeholder="Dirección del trabajo" aria-label="Dirección" value="${esc(S.dir)}" ${done?'disabled':''}></label><label class="fld">${ic('note',20)}<textarea rows="2" data-m="nt" placeholder="Notas (opcional)" aria-label="Notas" ${done?'disabled':''}>${esc(S.nt)}</textarea></label><div class="card"><b>Pago</b><div class="sub">Se coordina directamente con el prestador (efectivo o transferencia).</div></div>`+
 (done?`<div class="card cf"><b>Tu reserva está confirmada.</b><button class="btn" data-a="ord" data-id="${S.conf}">Ver seguimiento</button></div>`:'<button class="btn" data-a="book">Confirmar reserva</button>')};
V.favs=()=>{const l=S.pres.filter(p=>S.favs.includes(p.id));return '<h1>Favoritos</h1>'+(l.length?l.map(pcard).join(''):'<p class="sub">Todavía no guardaste favoritos. Abrí un prestador y tocá la estrella.</p>')};
V.hist=()=>{const l=S.orders.filter(o=>o.estado==='cerrada').sort((a,b)=>a.inicio<b.inicio?1:-1);return '<h1>Historial</h1>'+(l.length?l.map(ocard).join(''):'<p class="sub">Acá aparecen los trabajos que ya cerraste.</p>')};
const oa=V.auth;V.auth=()=>oa().replace('<p class="sub">Revisamos','<label class="fld">${ic("note",20)}</label><p class="sub">Revisamos'.replace('<label class="fld">${ic("note",20)}</label>','<label class="fld"><span>Foto</span><input type="file" accept="image/*" id="foto" aria-label="Foto de tu servicio"></label>')+'');
const op=V.perfil;V.perfil=()=>{let h=op();if(S.me.role==='prestador')h=h.replace('<button class="btn alt" data-a="out">',`<div class="card"><b>Foto de tu servicio</b><div class="hero" style="margin:10px 0;height:150px">${S.mp?img(S.mp):''}</div><label class="fld"><input type="file" accept="image/*" id="foto2" aria-label="Cambiar foto"></label></div><button class="btn alt" data-a="out">`);return h};
let ip=null;
const inst=()=>{
 if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return '';
 if(ip)return '<div class="card cf"><b>Instalá HomePro en tu celular</b><div class="sub">Se abre a pantalla completa, como una app.</div><button class="btn" data-a="instalar">Instalar</button></div>';
 if(/iphone|ipad/i.test(navigator.userAgent))return '<div class="card cf"><b>Instalá HomePro en tu iPhone</b><div class="sub">Tocá Compartir y después «Agregar a pantalla de inicio».</div></div>';
 return '';
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;if(['auth','perfil'].includes(S.view))render()});
window.addEventListener('appinstalled',()=>{ip=null;if(['auth','perfil'].includes(S.view))render()});
const A={
async instalar(){if(!ip)return;ip.prompt();await ip.userChoice;ip=null;render()},
tab:d=>{S.tab=d.v;render()},
rol:d=>{S.rol=d.v;render()},
rf:d=>{S.rf=S.rf===d.v?null:d.v;render()},
go:async d=>{if(d.v==='svc')await loadPub();if(d.v==='adm')await loadPend();go(d.v)},
async login(){try{await signInWithEmailAndPassword(auth,S.em||'',S.pw||'')}catch(e){toast(errMsg(e))}},
async reset(){if(!S.em)return toast('Escribí tu email primero');try{await sendPasswordResetEmail(auth,S.em);toast('Te enviamos un email para restablecer la contraseña')}catch(e){toast(errMsg(e))}},
async out(){await signOut(auth)},
async reg(){
 const p=S.rol==='prestador';
 if(!S.nom?.trim()||!S.em?.trim()||(S.pw||'').length<6)return toast('Completá nombre, email y una contraseña de 6 o más caracteres');
 if(p&&(!S.zona?.trim()||!(+S.desde>0)||!S.desc?.trim()))return toast('Completá zona, precio y descripción');
 try{
  S.booting=true;
  const c=await createUserWithEmailAndPassword(auth,S.em.trim(),S.pw);
  await setDoc(doc(db,'users',c.user.uid),{nombre:S.nom.trim(),email:S.em.trim(),role:S.rol,creadoEn:serverTimestamp()});
  if(p)await setDoc(doc(db,'prestadores',c.user.uid),{nombre:S.nom.trim(),rubro:S.rub||RUB[0],zona:S.zona.trim(),desde:+S.desde,desc:S.desc.trim(),foto:S.foto||'',estado:'pendiente',creadoEn:serverTimestamp()});
  S.booting=false;S.pw='';await boot(c.user);
 }catch(e){S.booting=false;toast(errMsg(e))}
},
det:d=>{S.pid=d.id;S.sid=null;S.slots=[];if(unslots)unslots();unslots=onSnapshot(collection(db,'prestadores',d.id,'turnos'),q=>{S.slots=q.docs.map(x=>({id:x.id,...x.data()}));drawSlots()});go('det')},
pick:d=>{S.sid=d.id;drawSlots()},
async book(){
 const p=S.pres.find(x=>x.id===S.pid),s=S.slots.find(x=>x.id===S.sid);
 if(!s)return toast('Elegí un turno');if(!S.dir?.trim())return toast('Ingresá la dirección del trabajo');
 try{
  const oid=await runTransaction(db,async tx=>{
   const sr=doc(db,'prestadores',p.id,'turnos',s.id),sn=await tx.get(sr);
   if(!sn.exists()||sn.data().estado!=='libre')throw new Error('turno-ocupado');
   const or=doc(collection(db,'ordenes'));
   tx.set(or,{clienteId:S.me.id,clienteNombre:S.me.nombre,prestadorId:p.id,prestadorNombre:p.nombre,rubro:p.rubro,turnoId:s.id,inicio:s.inicio,direccion:S.dir.trim(),notas:(S.nt||'').trim(),desde:p.desde,estado:'confirmada',pago:'a coordinar',creadaEn:serverTimestamp(),actualizadaEn:serverTimestamp()});
   tx.update(sr,{estado:'reservado',clienteId:S.me.id,ordenId:or.id});
   return or.id;
  });
  if(unslots){unslots();unslots=null}
  S.sid=null;S.nt='';toast('Reserva confirmada');go('ord',{oid})
 }catch(e){toast(e.message==='turno-ocupado'?'Ese turno ya fue tomado. Elegí otro.':errMsg(e))}
},
ord:d=>{S.oid=d.id;S.st=0;S.rt='';go('ord')},
async cancel(){const o=ord();try{const b=writeBatch(db);
 b.update(doc(db,'ordenes',o.id),{estado:'cancelada',actualizadaEn:serverTimestamp()});
 b.update(doc(db,'prestadores',o.prestadorId,'turnos',o.turnoId),{estado:'libre',clienteId:deleteField(),ordenId:deleteField()});
 await b.commit();toast('Reserva cancelada')}catch(e){toast(errMsg(e))}},
async adv(){const o=ord(),n=EST[EST.indexOf(o.estado)+1];try{await updateDoc(doc(db,'ordenes',o.id),{estado:n,actualizadaEn:serverTimestamp()})}catch(e){toast(errMsg(e))}},
async close(){try{await updateDoc(doc(db,'ordenes',ord().id),{estado:'cerrada',actualizadaEn:serverTimestamp()})}catch(e){toast(errMsg(e))}},
star:d=>{S.st=+d.v;render()},
async sendrev(){const o=ord();if(!S.st)return toast('Elegí de 1 a 5 estrellas');
 try{await setDoc(doc(db,'resenas',o.id),{ordenId:o.id,clienteId:S.me.id,prestadorId:o.prestadorId,estrellas:S.st,texto:(S.rt||'').trim(),creadaEn:serverTimestamp()});await loadPub();toast('¡Gracias por tu calificación!');render()}catch(e){toast(errMsg(e))}},
async addslot(){
 if(S.mp?.estado!=='aprobado')return toast('Primero tiene que aprobarse tu perfil');
 if(!S.sd||!S.stm)return toast('Elegí fecha y hora');
 const ini=S.sd+'T'+S.stm;if(ini<=nowL())return toast('Elegí un horario futuro');
 if(S.myslots.some(s=>s.inicio===ini))return toast('Ya publicaste ese turno');
 try{await addDoc(collection(db,'prestadores',S.me.id,'turnos'),{inicio:ini,estado:'libre',creadoEn:serverTimestamp()});toast('Turno publicado')}catch(e){toast(errMsg(e))}
},
async delslot(d){try{await deleteDoc(doc(db,'prestadores',S.me.id,'turnos',d.id))}catch(e){toast(errMsg(e))}},
async appr(d){try{await updateDoc(doc(db,'prestadores',d.id),{estado:'aprobado'});await loadPend();render()}catch(e){toast(errMsg(e))}},
async rej(d){try{await updateDoc(doc(db,'prestadores',d.id),{estado:'rechazado'});await loadPend();render()}catch(e){toast(errMsg(e))}}
};

A.hsvc=async()=>{await loadPub();S.rf=null;S.fv=false;S.pr=false;S.ur=false;S.q='';go('svc')};
A.soon=()=>toast('Próximamente en HomePro');
A.rub=async d=>{await loadPub();S.rf=d.v||null;S.fv=false;S.ur=false;S.q='';go('svc')};
A.fvc=()=>{S.fv=!S.fv;render()};
A.prc=()=>{S.pr=!S.pr;render()};
A.back=d=>go(d.v);
A.pf=()=>{S.pf=!S.pf;render()};
A.share=()=>{if(navigator.share)navigator.share({title:'HomePro360',text:'Mirá este servicio en HomePro360',url:location.origin}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.origin).then(()=>toast('Enlace copiado'))};
A.fav=()=>{const i=S.favs.indexOf(S.pid);if(i<0)S.favs.push(S.pid);else S.favs.splice(i,1);try{localStorage.setItem('hp_favs',JSON.stringify(S.favs))}catch(e){}render();toast(i<0?'Guardado en favoritos':'Quitado de favoritos')};
A.det=d=>{S.pid=d.id;S.sid=null;S.fd=null;S.conf=null;S.pf=false;S.slots=[];if(unslots)unslots();unslots=onSnapshot(collection(db,'prestadores',d.id,'turnos'),q=>{S.slots=q.docs.map(x=>({id:x.id,...x.data()}));drawSlots()});go('det')};
A.tobk=()=>{const s=S.slots.find(x=>x.id===S.sid);if(!s)return toast('Este prestador no tiene turnos libres');S.pick=s;go('bk')};
A.book=async()=>{
 const p=S.pres.find(x=>x.id===S.pid),s=S.pick;
 if(!s)return toast('Elegí un turno');if(!S.dir?.trim())return toast('Ingresá la dirección del trabajo');
 try{
  const oid=await runTransaction(db,async tx=>{
   const sr=doc(db,'prestadores',p.id,'turnos',s.id),sn=await tx.get(sr);
   if(!sn.exists()||sn.data().estado!=='libre')throw new Error('turno-ocupado');
   const or=doc(collection(db,'ordenes'));
   tx.set(or,{clienteId:S.me.id,clienteNombre:S.me.nombre,prestadorId:p.id,prestadorNombre:p.nombre,rubro:p.rubro,turnoId:s.id,inicio:s.inicio,direccion:S.dir.trim(),notas:(S.nt||'').trim(),desde:p.desde,estado:'confirmada',pago:'a coordinar',creadaEn:serverTimestamp(),actualizadaEn:serverTimestamp()});
   tx.update(sr,{estado:'reservado',clienteId:S.me.id,ordenId:or.id});
   return or.id;
  });
  if(unslots){unslots();unslots=null}
  S.conf=oid;S.oid=oid;S.st=0;S.rt='';S.nt='';toast('Reserva confirmada');render();
 }catch(e){if(e.message==='turno-ocupado'){toast('Ese turno ya fue tomado. Elegí otro.');go('det')}else toast(errMsg(e))}
};
document.addEventListener('input',e=>{
 if(!e.target.hasAttribute('data-s'))return;
 const q=e.target.value.toLowerCase().trim(),h=$('#hm'),r=$('#res');
 if(!q){r.innerHTML='';h.style.display='';return}
 h.style.display='none';
 const o=S.pres.filter(p=>(p.nombre+' '+p.rubro+' '+p.zona).toLowerCase().includes(q));
 r.innerHTML=o.length?o.map(pcard).join(''):'<p class="sub">No encontramos resultados.</p>';
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='sdia'){S.fd=t.value;S.sid=null;drawSlots()}
 else if(t.id==='shora')S.sid=t.value;
 else if((t.id==='foto'||t.id==='foto2')&&t.files[0]){
  try{const f=await readPhoto(t.files[0],720,400);
   if(t.id==='foto'){S.foto=f;toast('Foto cargada')}
   else{await updateDoc(doc(db,'prestadores',S.me.id),{foto:f});toast('Foto actualizada')}
  }catch(x){toast('No se pudo cargar la foto')}
 }
});
A.urc=()=>{S.ur=!S.ur;render()};
A.bell=()=>toast('Todavía no tenés notificaciones. Pronto vas a recibir avisos de tus reservas.');
document.addEventListener('input',e=>{if(e.target.dataset.m==='q'&&$('#lst'))$('#lst').innerHTML=svcList()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener('input',e=>{const k=e.target.dataset.m;if(k)S[k]=e.target.value});

if(firebaseConfig.apiKey.startsWith('TU_')){S.view='setup';render()}
else{
 app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
 render();
 onAuthStateChanged(auth,u=>{if(S.booting)return;if(u)boot(u);else{clean();S.me=null;S.orders=[];S.pw='';go('auth')}});
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
